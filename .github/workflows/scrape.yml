name: scrape

on:
  schedule:
    - cron: "17 * * * *"     # hourly scrape
    - cron: "41 6 * * 1"     # weekly board discovery (Mondays)
  workflow_dispatch:
    inputs:
      command:
        description: "scrape | discover | all"
        default: scrape

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -q
      - name: Run
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CMD="${{ inputs.command }}"
          elif [ "${{ github.event.schedule }}" = "41 6 * * 1" ]; then
            CMD=all
          else
            CMD=scrape
          fi
          python -u -m scraper "$CMD"
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update listings $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
