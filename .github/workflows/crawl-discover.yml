name: crawl-discover

# Monthly: find boards no community list links to (Common Crawl URL index) and promote the ones
# that currently have a US SWE internship into data/companies.json. Takes ~1.5 h, so it runs
# separately from the hourly scrape.
on:
  schedule:
    - cron: "23 3 2 * *"
  workflow_dispatch:

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  crawl-discover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u -m scraper crawl-discover
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Promote boards found via Common Crawl"
          git pull --rebase --autostash
          git push
